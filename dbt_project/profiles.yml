lineagelens:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5433') | as_number }}"
      user: "{{ env_var('PGUSER', 'lineage') }}"
      password: "{{ env_var('PGPASSWORD', 'lineage') }}"
      dbname: "{{ env_var('PGDATABASE', 'warehouse') }}"
      schema: analytics
      threads: 4
