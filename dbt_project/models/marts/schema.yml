version: 2

models:
  - name: fct_daily_revenue
    description: Daily revenue. The dashboard reads this table.
    columns:
      - name: order_date
        tests: [unique, not_null]
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
